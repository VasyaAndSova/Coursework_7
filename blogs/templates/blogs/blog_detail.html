{% extends 'catalog/base.html' %}
{% load my_tags %}
{% block content %}
<div class="container">
    <div class="row text-center">
            <div class="col-3">
                <div class="card mb-4 box-shadow" style="height: 400px; position: relative;">
                    <div class="card-header">
                        <h4 class="my-0 font-weight-normal">{{ object.title }}</h4>
                    </div>
                    <img src="{{ blog.image | media_filter }}" alt="{{ blog.title }}" style="max-height: 150px; object-fit: cover; width: 100%;">
                    <div class="card-body" style="padding-bottom: 60px;">
                        <p class="list-unstyled mt-3 mb-4 text-center m-3" style="height: 50px;">
                            {{ object.content }}
                            {{ object.is_published }}
                            {{ object.created_at }}
                            {{ object.views_counter }}
                        </p>
                    </div>
                    <a href="{% url 'blog:blog_list' %}" class="btn btn-lg btn-block btn-outline-primary" style="position: absolute; bottom: 10px; left: 10px; right: 10px; margin: auto;">Назад</a>
                </div>
            </div>
    </div>
</div>
{% endblock %}
