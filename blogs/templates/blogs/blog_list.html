{% extends 'catalog/base.html' %}
{% load my_tags %}
{% block content %}
<style>
    .card {
        height: 100%;
    }

    .card img {
        width: 100%;
        height: 200px;
        object-fit: cover;
    }

    .card-body {
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        height: 100%;
    }

    .btn-group {
        margin-top: auto;
    }
</style>

<section class="text-center container">
    {% if user.is_authenticated %}
    <p>
        <a href="{% url 'blog:blog_create' %}" class="btn btn-primary my-2">Создать блог</a>
    </p>
    {% endif %}
</section>
<div class="album py-5 bg-body-tertiary">
    <div class="container">
        <div class="row row-cols-1 row-cols-sm-2 row-cols-md-3 g-3">
            {% for blog in object_list %}
            <div class="col">
                <div class="card shadow-sm">
                    <img src="{{ blog.image | media_filter }}">
                    <div class="card-body">
                        <p class="card-text">{{ blog.title }}</p>
                        <p class="card-text">
                            {{ blog.content|truncatechars:100 }}
                        </p>
                        <div class="btn-group">
                            {% if user.is_authenticated %}
                            <a class="btn btn-primary" href="{% url 'blog:blog_detail' blog.pk %}"
                               role="button">Перейти</a>
                            {% endif %}
                        </div>
                    </div>
                </div>
            </div>
            {% endfor %}
        </div>
    </div>
</div>
{% endblock %}
