{% extends 'catalog/base.html' %}
{% block content %}
<div class="container">
    <form class="row" method="post" enctype="multipart/form-data">
        <div class="card">
            <div class="card-body">
                {% csrf_token %}
                {{ form.non_field_errors }}
                {{ form.as_p }}

                <button type="submit" class="btn btn-primary">
                    Зарегистрироваться
                </button>

            </div>
        </div>
    </form>
</div>
</div>
{% endblock %}
