{% extends 'catalog/base.html' %}
{% load my_tags %}
{% block content %}
<div class="container">
    <form class="row" method="post" enctype="multipart/form-data">
        <div class="card">
            <div class="card-body">
                {% csrf_token %}
                {{ form.non_field_errors }}
                {{ form.as_p }}

                <button type="submit" class="btn btn-primary">Сохранить</button>
                <a href="{% if object %}{% url 'catalog:product_delete' object.pk %}{% else %}{% url 'catalog:product_list' %}{% endif %}"
                   class="btn btn-danger">
                    Удалить
                </a>
            </div>
        </div>
    </form>
</div>
</div>
{% endblock %}
