{% extends 'catalog/base.html' %}
{% load my_tags %}
{% block content %}
<div class="container">
    <form class="row" method="post" enctype="multipart/form-data">
        <div class="card">
            <div class="card-body">
                {% csrf_token %}
                {{ form.non_field_errors }}
                {{ form.as_p }}
                        <button type="submit" class="btn btn-primary">
                            {% if object %}
                            Сохранить
                            {% else %}
                            Создать
                            {% endif %}
                        </button>

                        {% if object %}
                        <a href="{% url 'catalog:product_delete' object.pk %}" class="btn btn-danger">
                            Удалить
                        </a>
                        {% else %}
                        <a href="{% url 'catalog:product_list' %}" class="btn btn-danger">
                            Отменить
                        </a>
                        {% endif %}


            </div>
        </div>
    </form>
</div>
{% endblock %}
