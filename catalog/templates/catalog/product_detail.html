{% extends 'catalog/base.html' %}
{% load my_tags %}
{% block content %}
<div class="album py-5 bg-body-tertiary">
    <div class="container">
        <div class="row row-cols-1 row-cols-sm-2 row-cols-md-3 g-3">
            <div class="col">
                <div class="card shadow-sm">
                    <img src="{{ product.image | media_filter }}">
                    <div class="card-body">
                        <p class="card-text">Название: {{ object.name }}</p>
                        <p class="card-text">Описание: {{ object.description }}</p>
                        <p class="card-text">Категория: {{ object.category }}</p>
                        <p class="card-text">Цена: {{ product.price }}</p>
                        <div class="d-flex justify-content-between align-items-center">
                            <div class="d-flex">
                                <a class="btn btn-primary me-2" href="{% url 'catalog:product_list' %}" role="button">Назад</a>
                                <a class="btn btn-danger" href="{% url 'catalog:product_update' object.pk %}"
                                   role="button">Редактировать</a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
