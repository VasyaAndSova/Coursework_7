{% extends 'base.html' %}
{% load my_tags %}
{% block content %}
<div class="container">
    <div class="row text-center">
            <div class="col-3">
                <div class="card mb-4 box-shadow" style="height: 400px; position: relative;">
                    <div class="card-header">
                        <h4 class="my-0 font-weight-normal">{{ product.name }}</h4>
                    </div>
                    <img src="{{ product.image | media_filter }}" alt="{{ product.name }}" style="max-height: 150px; object-fit: cover; width: 100%;">
                    <div class="card-body" style="padding-bottom: 60px;">
                        <h1 class="card-title pricing-card-title">{{ product.price }} $</h1>
                        <p class="list-unstyled mt-3 mb-4 text-center m-3" style="height: 50px;">
                            {{ product.description }}
                            {{ product.category }}
                            {{ product.created_at }}
                            {{ product.updated_at }}
                        </p>
                    </div>
                    <a href="#" class="btn btn-lg btn-block btn-outline-primary" style="position: absolute; bottom: 10px; left: 10px; right: 10px; margin: auto;">Купить</a>
                </div>
            </div>
    </div>
</div>
{% endblock %}
